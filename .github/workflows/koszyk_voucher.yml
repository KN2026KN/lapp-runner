# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/koszyk_voucher.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - sprawdzenie kodu rabatowego w koszyku (kod zdejmowany)
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      kod: { description: kod rabatowy, required: true, default: IC5 }
jobs:
  z:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install -q playwright && bash .github/narzedzia/przygotuj.sh chromium
      - working-directory: robot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
          KOD: ${{ inputs.kod }}
          KODY: ic5,Ic5,IC10,IC-5,IC05
        run: python koszyk_voucher.py > /dev/null 2> ../data/log/koszyk_voucher_blad.txt || true
      - run: |
          git config user.name 'lapp-robot'; git config user.email 'robot@keura.eu'
          git add data/log/koszyk_voucher*; git commit -qm "Sprawdzenie kodu rabatowego" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
