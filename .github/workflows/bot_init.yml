# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/bot_init.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: Bot LAPP - podłączenie
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - run: pip install requests
      - name: Podłączenie
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: mkdir -p data/log && python3 bot/init.py 2>&1 | tee data/log/bot-init.txt
      - name: Zapis
        if: always()
        run: |
          git config user.name "keura-robot"; git config user.email "robot@keura.eu"
          git add -A bot data/log
          git commit -m "Bot LAPP: konfiguracja" || true
          git pull --rebase -q || true
          git push || true
