# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/analiza_zapytan.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - wysyłka zapytań (automatyczna analiza raz w miesiącu)
# 19.11.2026: uruchamia worker w pierwszy dzień roboczy miesiąca; ręcznie: tylko_log=1 -> bez zmiany parametrów i bez wiadomości
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      tylko_log: { description: '1 = bez wiadomości do właściciela', required: false, default: '' }
concurrency: { group: analiza_zapytan, cancel-in-progress: false }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TYLKO_LOG: ${{ inputs.tylko_log }}
        run: python3 robot/analiza_zapytan.py
      - run: |
          git config user.name "keura-robot"; git config user.email "robot@keura.eu"
          git add dane/zapytania_czasy.json; git commit -m "LAPP: historia godzin zapytań" || true
          git pull --rebase -q || true; git push || true
