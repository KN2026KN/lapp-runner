# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/oferta.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - oferta vs ceny eShop (porównanie)
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs: { nr: { description: 'Numer oferty - podgląd tylko dla właściciela (puste = kolejka)', default: '' }, sucho: { description: '1 = tylko log, bez wysyłki', default: '' }, aktual: { description: 'Nagłówek poprawionej wiadomości eShop do grupy', default: '' } }
concurrency: { group: oferta, cancel-in-progress: false }
jobs:
  o:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4   # 11.11.2026: pdftotext z pamięci podręcznej
        with:
          path: ~/.cache/apt-poppler
          key: apt-poppler-${{ runner.os }}-v1
      - run: bash .github/narzedzia/przygotuj.sh pdf && pip install -q matplotlib playwright
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          NR: ${{ inputs.nr }}
          SUCHO: ${{ inputs.sucho }}
          AKTUAL: ${{ inputs.aktual }}
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
        run: python3 robot/oferta_porownanie.py
