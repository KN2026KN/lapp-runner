# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/menu_odswiez.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - odświeżenie menu bota (grupa i właściciel)
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      wl: { description: 'Tylko właściciel (1) - bez komunikatu w grupie', default: '1' }
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: |
          HOOK=$(printf '%s' "${{ secrets.TELEGRAM_TOKEN }}" | sha256sum | cut -c1-48)
          curl -s -X POST -H "X-Telegram-Bot-Api-Secret-Token: $HOOK" -H "User-Agent: curl/8.5 keura-robot" "https://keura-boty.keura-boty.workers.dev/lapp/menu/odswiez?wl=${{ inputs.wl }}"
