# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/packing_zapytanie.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - prośba o spakowanie (Excel z WZ dla magazynu)
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      wyslij: { description: 'Wysłać właścicielowi (1) czy podgląd (0)', default: '1' }
      dopak: { description: 'Dodać pozycje, które dotrą dziś/jutro (1)', default: '0' }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - run: pip install -q openpyxl
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DOPAK: ${{ inputs.dopak }}
        run: python3 robot/packing_zapytanie.py $([ "${{ inputs.wyslij }}" = 1 ] && echo --wyslij)
      - if: inputs.wyslij == '1'
        run: |
          git config user.name "keura-robot"; git config user.email "robot@keura.eu"
          git add "dokumenty/Отгрузка/Zapytania"; git commit -qm "LAPP: prośba o spakowanie" || true
          git pull --rebase -q || true; git push -q || true
