# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/eshop_token.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - eShop logowanie (token dla bota)
permissions: { contents: read, actions: write }
on:
  schedule:
    - cron: '45 4,8,12 * * 1-5'
  workflow_dispatch:
jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4   # 11.11.2026: Chromium z pamięci podręcznej
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install -q playwright matplotlib && bash .github/narzedzia/przygotuj.sh chromium
      - name: Logowanie i zapis tokenu
        env:
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 robot/eshop_token.py
      - name: Wycena zaległych zapytań (jeśli są)
        env:
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 robot/eshop_wycena.py
      - name: Historia zamówień z kabinetu (menu bota)
        if: always()
        env:
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 robot/historia_zamowien.py
      - name: Jednostki cen ze strony eShop (💶 История цен)
        if: always()
        env:
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 robot/jednostki_cen.py || exit 0
          git config user.name "keura-robot"; git config user.email "robot@keura.eu"
          git add dane/jednostki_cen.json; git commit -qm "LAPP: jednostki cen z eShop" || exit 0
          git pull --rebase -q || true; git push -q || true
