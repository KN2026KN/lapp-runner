# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/eshop_test.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - eShop test logowania i cen
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      arty:
        description: 'Artykuły (spacją)'
        default: '1119803 0034702 2170453 52001980'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4   # 11.11.2026: Chromium z pamięci podręcznej
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install -q playwright && bash .github/narzedzia/przygotuj.sh chromium
      - name: Logowanie i odczyt cen
        env:
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
        run: python3 robot/eshop.py "${{ inputs.arty }}"
