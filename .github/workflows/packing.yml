# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/packing.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - finalny Packing List (Excel) po odpowiedzi magazynu
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      wyslij: { description: 'Wysłać do grupy i zapisać (1) czy tylko podgląd (0)', default: '0' }
      zapisz: { description: 'Tylko zapisać dane spakowanych WZ bez wysyłki (1)', default: '0' }
      wlasciciel: { description: 'Excel tylko do właściciela (1), bez grupy i zapisu', default: '0' }
      excel_grupa: { description: 'Tylko Excel do grupy (1), bez wiadomości o paletach i bez zapisu', default: '0' }
      poprawka: { description: 'Tekst poprawki w podpisie Excela (zapisuje nowy plik)', default: '' }
      palety_wz: { description: 'Poprawka WZ palet w KV: nr:wz,wz;nr:wz (tylko puste)', default: '' }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4   # 11.11.2026: Chromium z pamięci podręcznej
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install -q playwright openpyxl && bash .github/narzedzia/przygotuj.sh chromium
      - name: Kabinet (świeże numery WZ)
        env:
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 robot/kabinet.py
      - name: Poprawka WZ palet (KV lapp:palety)
        if: inputs.palety_wz != ''
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', PW: '${{ inputs.palety_wz }}' }
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          CF = 'https://api.cloudflare.com/client/v4/accounts/65af2776afd17487e6801b72986aed5a'; H = {'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']}
          cf = lambda u, d=None, m='GET': urllib.request.urlopen(urllib.request.Request(u, data=d, method=m, headers=H), timeout=30).read()
          kv = [x for x in json.loads(cf(f'{CF}/storage/kv/namespaces?per_page=100'))['result'] if x['title'] == 'keura-boty'][0]['id']
          P = json.loads(cf(f'{CF}/storage/kv/namespaces/{kv}/values/lapp:palety'))
          for cz in os.environ['PW'].split(';'):
              n, wz = cz.split(':'); p = P['palety'][int(n) - 1]
              while len(p) < 6: p.append([])
              if not p[4]: p[4] = wz.split(','); print('paleta', n, '->', p[4])
              else: print('paleta', n, 'ma już WZ', p[4])
          cf(f'{CF}/storage/kv/namespaces/{kv}/values/lapp:palety', json.dumps(P, ensure_ascii=False).encode(), 'PUT')
          PY
      - name: Packing List
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          POPRAWKA: ${{ inputs.poprawka }}
        run: python3 robot/packing_final.py $([ "${{ inputs.wyslij }}" = 1 ] && echo --wyslij) $([ "${{ inputs.wlasciciel }}" = 1 ] && echo --wlasciciel) $([ "${{ inputs.excel_grupa }}" = 1 ] && echo --excel-grupa)
      - name: Zapis
        if: inputs.wyslij == '1' || inputs.zapisz == '1' || inputs.poprawka != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name "keura-robot"; git config user.email "robot@keura.eu"
          [ "${{ inputs.wyslij }}" = 1 ] || [ -n "${{ inputs.poprawka }}" ] && git add dokumenty/Отгрузка
          git add dane/kabinet.json dane/spakowane.json; git commit -qm "LAPP: finalny Packing List" || true
          git pull --rebase -q || true; git push -q || true
          gh workflow run raporty.yml --ref main || true
