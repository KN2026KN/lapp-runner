# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/diag_poczta.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - diagnostyka poczty
permissions: { contents: read, actions: write }
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TG: ${{ secrets.TELEGRAM_TOKEN }}
      A: https://api.cloudflare.com/client/v4/accounts/65af2776afd17487e6801b72986aed5a
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - name: Kolejka poczty
        run: |
          mkdir -p data/log; L=data/log/poczta-diag.txt
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          KV=$(curl -s -H "$H" "$A/storage/kv/namespaces?per_page=100" | jq -r '.result[]|select(.title=="keura-boty")|.id')
          echo "klucze mail:key: $(curl -s -H "$H" "$A/storage/kv/namespaces/$KV/keys?prefix=mail:key:" | jq '.result|length')" > $L
          echo "pair: $(curl -s -H "$H" "$A/storage/kv/namespaces/$KV/keys?prefix=mail:pair:" | jq -c "[.result[].name]")" >> $L
          for p in $(curl -s -H "$H" "$A/storage/kv/namespaces/$KV/keys?prefix=mail:pair:" | jq -r ".result[].name"); do echo "$p = $(curl -s -H "$H" "$A/storage/kv/namespaces/$KV/values/$p" | cut -c1-8)" >> $L; done
          curl -s -H "$H" "$A/storage/kv/namespaces/$KV/keys?prefix=mail:q:&limit=1000" | jq -r '.result[].name' > /tmp/k.txt
          echo "wiadomości w kolejce: $(wc -l < /tmp/k.txt)" >> $L
          while read k; do
            curl -s -H "$H" "$A/storage/kv/namespaces/$KV/values/$k" | jq -r '[.data, .od, .temat, ((.zalaczniki//[])|map(.nazwa)|join(";"))]|@tsv' >> $L
          done < /tmp/k.txt
          curl -s "https://api.telegram.org/bot$TG/getWebhookInfo" | jq -c '.result|{pending_update_count,last_error_date,last_error_message,allowed_updates}' >> $L
          echo "cfg: $(curl -s -H "$H" "$A/storage/kv/namespaces/$KV/values/lapp:cfg")" >> $L
          echo "palety: $(curl -s -H "$H" "$A/storage/kv/namespaces/$KV/values/lapp:palety" | cut -c1-120)" >> $L
          cat $L
      - name: Zapis
        if: always()
        run: |
          git config user.name "keura-robot"; git config user.email "robot@keura.eu"
          git add data/log; git commit -m "LAPP: diagnostyka poczty" || true
          git pull --rebase -q || true; git push || true
