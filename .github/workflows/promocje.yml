# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/promocje.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - promocje i kody rabatowe (strona LAPP Polska, raz dziennie)
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      test: { description: 'Tylko wypisz teksty strony (bez KV i bota)', type: boolean, default: false }
  # 17.11.2026: decyzja właściciela - promocje bez harmonogramu (tylko ręcznie / z bota), także po 01.12.2026
jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4   # 11.11.2026: Chromium z pamięci podręcznej
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install -q playwright && bash .github/narzedzia/przygotuj.sh chromium
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRYB_TEST: ${{ inputs.test && '1' || '0' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 robot/promocje.py $([ "$TRYB_TEST" = 1 ] && echo --test)
