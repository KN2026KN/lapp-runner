# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/eshop_sprawdz.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - eShop diagnostyka artykułów
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs: { arts: { description: 'art:ilość, spacją', required: true } }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4   # 11.11.2026: Chromium z pamięci podręcznej
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install -q playwright && bash .github/narzedzia/przygotuj.sh chromium
      - env:
          ARTS: ${{ inputs.arts }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
        run: python3 robot/eshop_sprawdz.py
