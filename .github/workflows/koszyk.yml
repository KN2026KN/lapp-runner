# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/koszyk.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - zamówienie do koszyka eShop (przycisk 🛒 Заказ)
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      tryb: { description: 'nowy | dodaj | wyczysc', required: false, default: 'nowy' }
concurrency: { group: eshop-koszyk, cancel-in-progress: false }
jobs:
  k:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install -q playwright openpyxl && bash .github/narzedzia/przygotuj.sh chromium pdf
      - working-directory: robot
        env:
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TRYB: ${{ inputs.tryb }}
        run: python koszyk.py
      - run: |
          git config user.name 'lapp-robot'; git config user.email 'robot@keura.eu'
          git add dokumenty/CSV
          git diff --cached --quiet || (git commit -m "LAPP: CSV koszyka $(date +%F)" && (git push || (git pull --rebase && git push)))
