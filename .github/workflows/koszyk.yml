# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/koszyk.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - zamówienie do koszyka eShop (przycisk 🛒 Заказ)
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      tryb: { description: 'nowy | dodaj | wyczysc', required: false, default: 'nowy' }
      tekst: { description: '20.11.2026: zamówienie tekstem (artykuł ilość jm, linia po linii) - zapisywane jako lapp:zam:zlecenie', required: false, default: '' }
concurrency: { group: eshop-koszyk, cancel-in-progress: false }
jobs:
  k:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install -q playwright openpyxl && bash .github/narzedzia/przygotuj.sh chromium pdf
      - working-directory: robot
        env:
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TRYB: ${{ inputs.tryb }}
          TEKST: ${{ inputs.tekst }}
        run: |
          if [ -n "$TEKST" ]; then python3 -c "import json,os,sys; sys.path.insert(0,'.'); src=open('eshop_wycena.py').read().replace('\nmain()','\n'); ns={'__file__':os.path.abspath('eshop_wycena.py'),'__name__':'x'}; exec(compile(src,'eshop_wycena.py','exec'),ns); ns['kv_put']('lapp:zam:zlecenie', json.dumps({'tekst': os.environ['TEKST']}, ensure_ascii=False), None)"; fi
          python koszyk.py
      - run: |
          git config user.name 'lapp-robot'; git config user.email 'robot@keura.eu'
          git add dokumenty/CSV
          git diff --cached --quiet || (git commit -m "LAPP: CSV koszyka $(date +%F)" && (git push || (git pull --rebase && git push)))
