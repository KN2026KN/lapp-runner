# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/ceny_kontrola.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - czy eShop zaktualizował ceny wg oferty
permissions: { contents: read, actions: write }
on:
  schedule: [{ cron: '23 9,13 * * 1-5' }]   # dni robocze, ok. 10:23 i 14:23 (zima) czasu polskiego
  workflow_dispatch:
concurrency: { group: oferta, cancel-in-progress: false }
jobs:
  k:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - run: pip install -q playwright
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
        run: python3 robot/ceny_kontrola.py
