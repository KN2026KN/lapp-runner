# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/proforma.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - proforma (sprawdzenie, do grupy, stan płatności)
permissions: { contents: read, actions: write }
on:
  workflow_dispatch:
    inputs:
      nr: { description: 'numer proformy (8019…)', required: true }
      test: { description: '1 = tylko do właściciela (podgląd), bez zapisu stanu', required: false, default: '' }
concurrency: { group: proforma, cancel-in-progress: false }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-pol >/dev/null
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          NR: ${{ inputs.nr }}
          TEST: ${{ inputs.test }}
        run: python3 robot/proforma.py
