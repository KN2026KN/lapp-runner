# WYGENEROWANE z KN2026KN/keura-lapp .github/workflows/kabinet_diag.yml (runner_gen.py) - zmiany robić w prywatnym repo i generować ponownie
name: LAPP - kabinet diagnostyka (tylko odczyt)
permissions: { contents: read, actions: write }
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: KN2026KN/keura-lapp, token: '${{ secrets.PRIV_TOKEN }}' }
      - uses: actions/cache@v4   # 11.11.2026: Chromium z pamięci podręcznej
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install -q playwright && bash .github/narzedzia/przygotuj.sh chromium
      - env:
          LAPP_SHOP_LOGIN: ${{ secrets.LAPP_SHOP_LOGIN }}
          LAPP_SHOP_HASLO: ${{ secrets.LAPP_SHOP_HASLO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 robot/kabinet.py --diag
